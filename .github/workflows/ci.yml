name: CI

on:
  push:
    branches: [main]
  pull_request:

# Neither job writes anything (no PR comments, releases, or pushes) — they
# only check out code and run lint/tests, so read-only access is all the
# GITHUB_TOKEN needs. Without this, the token defaults to broader
# permissions than either job actually uses.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # jsonschema/python-docx are optional at runtime (models.py degrades
      # gracefully without them — see README.md#requirements), but installing
      # them here means the tests actually exercise those code paths instead
      # of always hitting the "not installed" branch.
      - run: pip install jsonschema python-docx
      # test_tab_utils.py creates real tk.Tk() windows; ubuntu-latest runners
      # have no X display, so xvfb-run provides a virtual one for pytest to
      # use (see tests/test_tab_utils.py's ERROR: "no display name and no
      # $DISPLAY environment variable" without this).
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run --auto-servernum pytest

  sbom:
    name: SBOM drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cyclonedx-bom
      # Regenerates sbom.json (scripts/generate_sbom.sh) into a scratch
      # location and diffs it against the committed one — --output-reproducible
      # makes the output deterministic run-to-run, so any difference here
      # means requirements.txt changed without sbom.json being regenerated
      # to match (see scripts/generate_sbom.sh and README.md#sbom).
      - run: |
          cp sbom.json /tmp/sbom.committed.json
          bash scripts/generate_sbom.sh
          diff -u /tmp/sbom.committed.json sbom.json || {
            echo "::error::sbom.json is out of date — run scripts/generate_sbom.sh and commit the result."
            exit 1
          }
